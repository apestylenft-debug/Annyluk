<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anny Finance">
<meta name="theme-color" content="#F6F0FF">
<title>AnnyLuk Finance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F0FF;--ink:#3B2F5C;--mut:#6E6392;--pri:#7457C2;--soft:#E4D6FA;--line:#EFE7FB;--pink:#FCE8F3;--neg:#B0407E;--pos:#2F7D5B}
@media(prefers-color-scheme:dark){:root{--bg:#1E1830;--ink:#F0E9FF;--mut:#B6A9D6;--pri:#9B82E6;--soft:#3A2F5C;--line:#32284F;--pink:#3A2440;--neg:#F08CBD;--pos:#7ED3AA}.card,.sheet,input,select{background:#2A2142!important}button.pri{color:#1E1830!important}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali',sans-serif}
body{padding:calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
h1,h2{margin:0}h2{font-size:17px;margin:18px 0 8px}
.card{background:#fff;border-radius:20px;padding:6px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.mut{color:var(--mut);font-size:13px}.b{font-weight:600}
button{font-family:inherit;min-height:46px;border:0;border-radius:16px;padding:0 14px;font-size:15px;background:#fff;color:var(--pri);font-weight:600;cursor:pointer}
button.pri{background:var(--pri);color:#fff}button.ghost{background:transparent;border:1.5px solid var(--soft)}button.del{background:transparent;color:var(--neg);border:1.5px solid var(--soft)}
.chip{border-radius:22px;background:var(--soft);min-height:44px}.chip.on{background:var(--pri);color:#fff}
input,select{width:100%;min-height:46px;border:1.5px solid var(--soft);border-radius:14px;padding:0 12px;font:inherit;font-size:16px;background:#FBF8FF;color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:10px}
.hero{background:var(--pri);color:#fff;border-radius:24px;padding:20px;margin:14px 0}
.hero .n{font-size:32px;font-weight:600}.btns{display:flex;gap:8px}.btns button{flex:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:#B79CF0}
#ov{position:fixed;inset:0;background:rgba(40,25,70,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.chips .chip{padding:0 6px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(20px + env(safe-area-inset-bottom));min-height:56px;border-radius:28px;background:var(--pri);color:#fff;box-shadow:0 6px 18px rgba(80,50,150,.35);z-index:5;padding:0 22px;font-size:16px}
.note{background:var(--pink);border-radius:18px;padding:12px 14px;font-size:13px;color:var(--mut);margin:12px 0}.lk{color:var(--pri);font-size:13px;text-decoration:underline}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;margin:0;padding:0;border:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:#cfc3ea;border-radius:14px;transition:.2s}.sw i:before{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--pri)}.sw input:checked+i:before{transform:translateX(18px)}.off{opacity:.55}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.sec button{min-height:38px;font-size:14px;background:var(--soft)}.err{color:var(--neg);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const SB_URL='https://etqgjkeyoxgfncphtiao.supabase.co';
const SB_KEY='sb_publishable_adz6BHqdK99sKdBnJsNk-g_PRRhpYTj';
const TL={income:'รายรับ',expense:'รายจ่าย',transfer:'โอน',card_purchase:'รูดบัตร',card_payment:'ชำระบัตรเครดิต',security_buy:'ซื้อหุ้น/กองทุน',security_sell:'ขายหุ้น/กองทุน',gold_buy:'ซื้อทองคำ',gold_sell:'ขายทองคำ',fx_buy:'แลกเงินตราต่างประเทศ (เก็บไว้)',fx_sell:'แลกเงินตราต่างประเทศกลับเป็นบาท'};
const AT={deposit:'เงินฝาก',card:'บัตรเครดิต',securities:'หุ้น/กองทุน',other:'อื่นๆ'};
let sb,A=[],T=[],L=[],SL=[],PR=[],IP=[],II=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'฿'+Math.abs(Number(n)).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdt=d=>new Date(d).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const nm=id=>{const a=A.find(x=>x.id===id);return a?a.nickname:'(บัญชีที่ลบแล้ว)'};
async function q(p){const r=await p;if(r.error){alert('ผิดพลาด: '+r.error.message);throw r.error}return r.data}
function openSheet(h){$('sheet').innerHTML=h;$('ov').style.display='flex'}
function closeSheet(){$('ov').style.display='none'}
function bal(a){let b=Number(a.opening_balance);for(const t of T){if(t.to_account_id===a.id)b+=Number(t.amount);if(t.from_account_id===a.id)b-=Number(t.amount)}return b}

async function init(){
  if(!window.supabase){$('app').innerHTML='<p class="err">โหลดระบบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p>';return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const{data}=await sb.auth.getSession();
  data.session?load():loginView();
}
function loginView(){
  $('app').innerHTML=`<h1 style="margin-top:40px">AnnyLuk Finance</h1><p class="mut">เข้าสู่ระบบเพื่อดูบัญชีของคุณ</p>
  <div class="card" style="padding:18px"><label>อีเมล<input id="em" type="email" autocomplete="username"></label>
  <label>รหัสผ่าน<input id="pw" type="password" autocomplete="current-password"></label>
  <div class="err" id="le"></div><button class="pri" style="width:100%" onclick="login()">เข้าสู่ระบบ</button></div>`;
}
async function login(){
  const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error){$('le').textContent='เข้าสู่ระบบไม่สำเร็จ: '+error.message;return}
  load();
}
async function logout(){await sb.auth.signOut();A=[];T=[];loginView()}
async function load(){
  A=await q(sb.from('accounts').select('*').is('deleted_at',null).order('display_order'));
  T=await q(sb.from('transactions').select('*').is('deleted_at',null).order('occurred_at',{ascending:false}));
  L=await q(sb.from('security_lots').select('*'));SL=await q(sb.from('security_sales').select('*'));PR=await q(sb.from('security_prices').select('*'));IP=await q(sb.from('installment_plans').select('*').order('created_at'));II=await q(sb.from('installment_items').select('*'));
  home();
}
function cardRow(a){const b=bal(a),used=Math.max(0,-b),lim=Number(a.credit_limit||0),ps=IP.filter(p=>p.card_account_id===a.id);
  const pl=ps.map(p=>{const st=planStat(p);return `<div class="mut">ผ่อน: ${esc(p.title)} · ${fmt(st.per)}/งวด · จ่ายแล้ว ${st.paid}/${p.months} · เหลือ ${fmt(st.remain)}</div>`}).join('');
  return `<div class="row${a.exclude_from_total?' off':''}" style="align-items:flex-start"><div><div>${esc(a.nickname)}${a.exclude_from_total?' <span class="mut">· ไม่รวมในยอดรวม</span>':''}</div>${lim?`<div class="mut">ใช้ไป ${fmt(used)} จากวงเงิน ${fmt(lim)} · เหลือ ${fmt(lim-used)}</div>`:'<div class="mut">ยังไม่ได้ตั้งวงเงิน</div>'}${pl}<a href="#" class="lk" onclick="setLimit('${a.id}');return false">แก้ไขวงเงิน</a> · <a href="#" class="lk" onclick="openPlans('${a.id}');return false">ผ่อนชำระ${ps.length?' ('+ps.length+')':''}</a></div><span style="display:flex;align-items:center;gap:10px"><span class="b">${fmt(b)}</span>${sw(a)}</span></div>`}
async function setLimit(id){const a=A.find(x=>x.id===id),v=prompt('วงเงินของ '+a.nickname+' (บาท)',a.credit_limit||'');if(v===null)return;
  const n=Number(v);if(!(n>=0)){alert('ใส่ตัวเลขวงเงิน');return}await q(sb.from('accounts').update({credit_limit:n}).eq('id',id));load()}
function home(){
  const non=A.filter(a=>a.account_type!=='card'),cards=A.filter(a=>a.account_type==='card');
  const nEx=A.filter(a=>a.exclude_from_total).length,tot=non.filter(a=>!a.exclude_from_total).reduce((s,a)=>s+bal(a),0),debt=cards.filter(a=>!a.exclude_from_total).reduce((s,a)=>s+Math.min(0,bal(a)),0);
  const groups={};A.forEach(a=>{const k=a.institution||'อื่นๆ';(groups[k]=groups[k]||[]).push(a)});
  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>AnnyLuk Finance</h1><div class="mut">ภาพรวมบัญชี · ข้อมูลจริงจาก Supabase</div></div><button class="ghost" onclick="logout()">ออก</button></div>
  <div class="note">ยอดที่แสดงคือผลรวมจากรายการที่บันทึกในระบบนี้เท่านั้น ยังไม่ผ่านการกระทบยอดกับ statement จริง ตอนนี้รองรับ รายรับ / รายจ่าย / โอน / รูดบัตร / หุ้น-กองทุน ทองคำ เงินตราต่างประเทศ และผ่อนชำระ</div>
  <div class="hero"><div style="opacity:.9;font-size:14px">ยอดรวมบัญชีที่ไม่ใช่บัตร${nEx?` (ไม่รวม ${nEx} บัญชี)`:''}</div><div class="n">${fmt(tot)}</div><div style="font-size:13px;opacity:.9">หนี้บัตรเครดิตรวม ${fmt(-debt)}</div><div style="font-size:13px;opacity:.9">มูลค่าสินทรัพย์ลงทุน (หุ้น ทอง เงินตรา) ตามราคาล่าสุด ${fmt(portfolioTotal())}</div></div>
  ${staleBanner()}<div class="sec"><h2 style="margin:0">บัญชี</h2><div style="display:flex;gap:8px"><button onclick="openManage()">จัดการบัญชี</button><button onclick="openMonth()">สรุปรายเดือน</button></div></div><div class="mut" style="margin:-2px 0 4px">สวิตช์ท้ายแต่ละบัญชี: เปิด = นับรวมในยอดรวม · ปิด = ไม่รวม</div>`;
  if(!A.length)h+='<div class="card"><p class="mut">ยังไม่มีบัญชี กด "จัดการบัญชี" เพื่อเพิ่ม</p></div>';
  for(const g in groups){h+=`<div class="mut" style="margin:12px 0 4px">${esc(g)}</div><div class="card">`+groups[g].map(a=>a.account_type==='card'?cardRow(a):`<div class="row${a.exclude_from_total?' off':''}"><span>${esc(a.nickname)}${a.exclude_from_total?' <span class="mut">· ไม่รวมในยอดรวม</span>':''}</span><span style="display:flex;align-items:center;gap:10px"><span class="b">${fmt(bal(a))}</span>${sw(a)}</span></div>`).join('')+'</div>'}
  h+=portfolioHTML('security')+portfolioHTML('gold')+portfolioHTML('fx');h+='<h2>ประวัติล่าสุด</h2><div class="card">';
  h+=T.length?T.slice(0,50).map(t=>{const inn=isIn(t);
    return `<div class="row" onclick="openSlip('${t.id}')" style="cursor:pointer"><div><div>${TL[t.txn_type]}${t.category?' · '+esc(t.category):''}${t.owner?' · '+esc(t.owner):''}</div><div class="mut">${fdt(t.occurred_at)}</div></div><span class="b" style="color:${inn?'var(--pos)':t.txn_type==='transfer'?'var(--ink)':'var(--neg)'}">${t.txn_type==='transfer'?'':inn?'+':'-'}${fmt(t.amount)}</span></div>`}).join(''):'<p class="mut">ยังไม่มีรายการ กด "+ เพิ่มรายการ" เพื่อเริ่มบันทึก</p>';
  $('app').innerHTML=h+'</div><button class="fab" onclick="openAdd(\'expense\')">+ เพิ่มรายการ</button>';
}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function opts(list,sel){return '<option value="">เลือกบัญชี</option>'+list.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.nickname)}</option>`).join('')}
function openAdd(type){
  const cards=A.filter(a=>a.account_type==='card'),non=A.filter(a=>a.account_type!=='card');
  const ORDER=['income','expense','transfer','card_payment','card_purchase','security_buy','security_sell','gold_buy','gold_sell','fx_buy','fx_sell'];
  const chips=`<label>ประเภทรายการ<select onchange="openAdd(this.value)">${ORDER.map(k=>`<option value="${k}"${k===type?' selected':''}>${TL[k]}</option>`).join('')}</select></label>`;
  let f='';
  if(type==='income')f=`<label>บัญชีที่รับเข้า<select id="to">${opts(A)}</select></label>`;
  if(type==='expense')f=`<label>บัญชีที่จ่าย<select id="from">${opts(non)}</select></label>`;
  if(type==='transfer')f=`<label>จากบัญชี<select id="from">${opts(A)}</select></label><label>ไปบัญชี (จ่ายบัตรคืน เลือกบัตรตรงนี้)<select id="to">${opts(A)}</select></label>`;
  if(type==='card_purchase')f=`<label>บัตรที่รูด<select id="from">${opts(cards)}</select></label>`;
  if(type==='card_payment')f=`<label>บัญชีต้นทาง (จ่ายจาก)<select id="from">${opts(non)}</select></label><label>บัตรเครดิตที่ชำระ<select id="to">${opts(cards)}</select></label>`;
  const tf=typeForm(type);if(tf)f=tf;
  window._type=type;const sec=/^(security|gold|fx)_/.test(type);
  openSheet(`<h2 style="margin-top:0">เพิ่มรายการ</h2>${chips}${f}
  <label>${type.endsWith('_buy')?'ยอดที่จ่ายจริง (บาท)':isSellT(type)?'ยอดที่ได้รับ (บาท คำนวณให้)':'จำนวนเงิน (บาท)'}<input id="amt" type="number" inputmode="decimal" step="0.01" min="0"${isSellT(type)?' readonly':''}></label>
  ${sec?'':'<label>หมวด / รายละเอียด<input id="cat"></label>'}<label>วันที่-เวลา<input id="dt" type="datetime-local" value="${nowLocal()}"></label>
  <label>เจ้าของ (ไม่บังคับ เช่น ชื่อคนในครอบครัว เว้นว่างได้ถ้าเป็นของกลาง)<input id="own"></label><label>หมายเหตุ (ไม่บังคับ)<input id="note"></label><div class="err" id="fe"></div>
  <button class="pri" style="width:100%" onclick="preview('${type}')">ตรวจสอบก่อนบันทึก</button>`);
}
const GRAM=15.244;
const kindOf=t=>t.startsWith('gold')?'gold':t.startsWith('fx')?'fx':'security';
const KT={security:'หุ้น / กองทุน',gold:'ทองคำ',fx:'เงินตราต่างประเทศ'};
const isSellT=t=>t.endsWith('_sell');
const stale=d=>!d||Date.now()-new Date(d).getTime()>864e5;
const fdt2=d=>new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
function isIn(t){return t.txn_type==='income'||isSellT(t.txn_type)}
function lotKind(l){return l.kind||'security'}
function lotDate(l){const t=T.find(x=>x.id===l.buy_txn_id);return t?t.occurred_at:l.created_at}
function symLabel(sym,kind){return kind==='gold'?'ทองคำ':kind==='fx'?String(sym).replace('FX:','')+' (เงินตรา)':sym}
function unitLabel(kind,u,sym){u=Number(u);return kind==='gold'?`${u} กรัม (${(u/GRAM).toFixed(4)} บาททอง)`:kind==='fx'?`${u} ${String(sym).replace('FX:','')}`:`${u} หน่วย`}
function symList(){return[...new Set(L.filter(l=>lotKind(l)==='security').map(l=>l.symbol))]}
function priceRow(s){return PR.find(x=>x.symbol===s)}
function fxRate(c){const p=priceRow('FX:'+c)||(c==='USD'?priceRow('USDTHB'):null);return p?Number(p.price):null}
function fxNow(){return fxRate('USD')}
function holdings(kind,inc){const m={};
  for(const l of L){if(lotKind(l)!==kind||SL.some(s=>s.lot_id===l.id)||(inc&&excl(l.holding_account_id)))continue;
    const h=m[l.symbol]=m[l.symbol]||{sym:l.symbol,kind,cur:l.currency,units:0,cost:0};h.units+=Number(l.units);h.cost+=Number(l.cost_thb)}
  return Object.values(m).map(h=>{const p=priceRow(kind==='gold'?'GOLD':h.sym);h.price=p?Number(p.price):null;h.asof=p?p.as_of:null;let v=null;
    if(h.price!=null){if(kind==='gold')v=h.units/GRAM*h.price;else if(kind==='fx')v=h.units*h.price;else{const fx=h.cur==='USD'?fxNow():1;v=fx!=null?h.units*h.price*fx:null}}
    h.value=v;h.pl=v==null?null:v-h.cost;return h})}
function portfolioTotal(){return['security','gold','fx'].reduce((s,k)=>s+holdings(k,true).reduce((a,h)=>a+(h.value!=null?h.value:h.cost),0),0)}
function staleBanner(){const n=['security','gold','fx'].reduce((c,k)=>c+holdings(k).filter(x=>x.price==null||x.value==null||stale(x.asof)).length,0);
  return n?`<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>ราคาของ ${n} รายการยังไม่ได้อัปเดตวันนี้ มูลค่าอาจไม่ตรงปัจจุบัน</span><button onclick="openPrices()" style="min-height:38px;font-size:14px">อัปเดตราคา</button></div>`:''}
function priceText(x){return x.kind==='gold'?`ราคารับซื้อ ${fmt(x.price)} / บาททอง`:x.kind==='fx'?`อัตรา ${x.price} บาท/${x.sym.replace('FX:','')}`:`ราคา ${x.price} ${x.cur}`}
function portfolioHTML(kind){
  const hs=holdings(kind);let h=`<div class="sec"><h2 style="margin:0">${KT[kind]}</h2><button onclick="openPrices()">อัปเดตราคา</button></div>`;
  if(!hs.length)return h+`<div class="card"><p class="mut">ยังไม่มี${KT[kind]} กด "+ เพิ่มรายการ" แล้วเลือก ${kind==='gold'?'ซื้อทองคำ':kind==='fx'?'แลกเงินตราต่างประเทศ':'ซื้อหุ้น/กองทุน'}</p></div>`;
  h+='<div class="card">'+hs.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="border:0;padding:0"><span class="b">${esc(symLabel(x.sym,kind))}</span><span class="b">${x.value==null?'-':fmt(x.value)}</span></div>

function planStat(p){const it=II.filter(i=>i.plan_id===p.id).sort((a,b)=>a.seq-b.seq);return{it,paid:it.filter(paidItem).length,remain:it.filter(i=>!paidItem(i)).reduce((s,i)=>s+Number(i.amount),0),per:it[0]?Number(it[0].amount):0}}
function openPlans(cardId){const ps=IP.filter(p=>p.card_account_id===cardId);
  let h=`<h2 style="margin-top:0">ผ่อนชำระ · ${esc(nm(cardId))}</h2><p class="mut">กด "จ่ายแล้ว" เมื่อบิลของงวดนั้นขึ้นจริง ระบบจะบันทึกเป็นรายการรูดบัตรให้</p>`;
  if(!ps.length)h+='<p class="mut">ยังไม่มีแผนผ่อนในบัตรนี้</p>';
  ps.forEach(p=>{const st=planStat(p);h+=`<div class="card" style="margin-bottom:12px;padding:12px 16px"><div class="row" style="border:0"><span class="b">${esc(p.title)}</span><span class="mut">จ่ายแล้ว ${st.paid}/${p.months} งวด</span></div>
  <div class="mut">ยอดเต็ม ${fmt(p.total_amount)} · งวดละ ${fmt(st.per)} · เหลือจ่าย ${fmt(st.remain)}</div>`+
  st.it.map(i=>`<div class="row"><span>งวด ${i.seq} · ${fdt2(i.due_date)}</span><span>${fmt(i.amount)} ${paidItem(i)?'<b style="color:var(--pos)">จ่ายแล้ว</b>':`<button style="min-height:36px;font-size:13px" onclick="payInst('${i.id}')">จ่ายแล้ว</button>`}</span></div>`).join('')+
  `<button class="del" style="width:100%;margin-top:8px" onclick="delPlan('${p.id}')">ลบแผนนี้</button></div>`});
  openSheet(h+`<div class="btns"><button class="ghost" onclick="closeSheet()">ปิด</button><button class="pri" onclick="openPlanForm('${cardId}')">+ เพิ่มแผนผ่อน</button></div>`)}
function openPlanForm(cardId){const d=new Date();d.setMonth(d.getMonth()+1);
  openSheet(`<h2 style="margin-top:0">เพิ่มแผนผ่อนชำระ</h2><label>ชื่อสินค้า/รายการ<input id="pt"></label>
  <label>บัตรเครดิต<select id="pc">${opts(A.filter(a=>a.account_type==='card'),cardId)}</select></label>
  <label>ยอดเต็ม (บาท)<input id="pa" type="number" step="0.01" inputmode="decimal" oninput="planHint()"></label>
  <label>จำนวนงวด (เดือน)<input id="pm" type="number" inputmode="numeric" oninput="planHint()"></label>
  <label>วันครบกำหนดงวดแรก<input id="pd" type="date" value="${d.toISOString().slice(0,10)}"></label>
  <div class="b" id="ph" style="margin-bottom:8px"></div><div class="err" id="pe"></div>
  <div class="btns"><button class="ghost" onclick="openPlans('${cardId}')">ยกเลิก</button><button class="pri" onclick="savePlan()">สร้างแผนผ่อน</button></div>`)}
function planHint(){const t=Number($('pa').value),m=Math.round(Number($('pm').value));$('ph').textContent=t>0&&m>=1?`งวดละประมาณ ${fmt(Math.floor(t/m*100)/100)} × ${m} งวด`:''}
function addMonths(d,i){const[y,m,day]=d.split('-').map(Number),last=new Date(y,m-1+i+1,0).getDate(),x=new Date(y,m-1+i,Math.min(day,last));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
async function savePlan(){const t=$('pt').value.trim(),c=$('pc').value,tot=Number($('pa').value),m=Math.round(Number($('pm').value)),d=$('pd').value;
  if(!t||!c||!(tot>0)||!(m>=1)||!d){$('pe').textContent='กรอกให้ครบทุกช่อง';return}
  if(m>60&&!confirm('จำนวนงวดเกิน 60 เดือน แน่ใจหรือไม่?'))return;
  const base=Math.floor(tot/m*100)/100,items=[];let acc=0;
  for(let i=0;i<m;i++){const amt=i===m-1?Math.round((tot-acc)*100)/100:base;acc+=amt;items.push({seq:i+1,due_date:addMonths(d,i),amount:amt})}
  const p=await q(sb.from('installment_plans').insert({card_account_id:c,title:t,total_amount:tot,months:m,first_due:d}).select().single());
  await q(sb.from('installment_items').insert(items.map(x=>({...x,plan_id:p.id}))));await load();openPlans(c)}
async function payInst(id){const i=II.find(x=>x.id===id),p=IP.find(x=>x.id===i.plan_id);
  const t=await q(sb.from('transactions').insert({txn_type:'card_purchase',from_account_id:p.card_account_id,amount:i.amount,category:`${p.title} (งวด ${i.seq}/${p.months})`,occurred_at:new Date().toISOString()}).select().single());
  await q(sb.from('installment_items').update({paid_txn_id:t.id}).eq('id',id));await load();openPlans(p.card_account_id)}
async function delPlan(id){const p=IP.find(x=>x.id===id);if(!confirm('ลบแผนผ่อนนี้? รายการรูดบัตรที่บันทึกไปแล้วจะยังอยู่ในประวัติ (ลบเองได้)'))return;
  await q(sb.from('installment_plans').delete().eq('id',id));await load();openPlans(p.card_account_id)}
function exportXlsx(ym){
  if(!window.XLSX){alert('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');return}
  const{R,inc,exp,s0,e0}=monthData(ym),wb=XLSX.utils.book_new(),used={},d2=d=>{const x=new Date(d);return[x.toLocaleDateString('th-TH'),x.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})]};
  const sn=n=>{let b=String(n).replace(/[\[\]:*?\/\\]/g,'').slice(0,28)||'บัญชี',k=b,i=2;while(used[k]){k=b.slice(0,26)+'_'+i++}used[k]=1;return k};
  const add=(rows,name)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sn(name));
  const sum=[['สรุปเดือน '+ym],[],['รายรับรวม',inc],['รายจ่ายรวม (รวมรูดบัตร)',exp],['คงเหลือสุทธิ',inc-exp],['มูลค่าสินทรัพย์ลงทุนตามราคาล่าสุด',portfolioTotal()],[],['บัญชี','ธนาคาร','ประเภท','ยกมา','เข้า','ออก','คงเหลือสิ้นเดือน']];
  R.forEach(r=>sum.push([r.a.nickname,r.a.institution||'',AT[r.a.account_type],r.open,r.i,r.o,r.open+r.i-r.o]));add(sum,'สรุป');
  for(const r of R){const rows=[[r.a.nickname+' · เดือน '+ym],['ยกมา',r.open],[],['วันที่','เวลา','ทิศทาง','จำนวนเงิน','ประเภท','รายละเอียด','เจ้าของ','หมายเหตุ']];
    T.filter(t=>{const d=new Date(t.occurred_at);return d>=s0&&d<e0&&(t.from_account_id===r.a.id||t.to_account_id===r.a.id)}).sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at))
     .forEach(t=>{const[dd,tt]=d2(t.occurred_at);rows.push([dd,tt,t.to_account_id===r.a.id?'เข้า':'ออก',Number(t.amount),TL[t.txn_type],t.category||'',t.owner||'',t.note||''])});
    rows.push([],['รวมเข้า',r.i],['รวมออก',r.o],['คงเหลือสิ้นเดือน',r.open+r.i-r.o]);add(rows,r.a.nickname)}
  const pf=[['พอร์ตลงทุน (หุ้น/กองทุน ทอง เงินตรา) ตามราคาล่าสุดที่กรอกไว้'],[],['หมวด','รายการ','จำนวนที่ถือ','ต้นทุน (บาท)','ราคาล่าสุด','ณ วันที่','มูลค่า (บาท)','กำไร/ขาดทุน (บาท)','%']];
  ['security','gold','fx'].forEach(k=>holdings(k).forEach(h=>pf.push([KT[k],symLabel(h.sym,k),h.units,h.cost,h.price==null?'':h.price,h.asof?d2(h.asof)[0]:'',h.value==null?'':h.value,h.pl==null?'':h.pl,h.pl==null||!h.cost?'':h.pl/h.cost])));
  pf.push([],['รายล็อต'],['หมวด','วันที่ซื้อ','รายการ','บัญชีที่เก็บ','จำนวน (หน่วย/กรัม/สกุลต่างประเทศ)','ราคาต่อหน่วย','สกุล','อัตราแลกเปลี่ยน','ค่าธรรมเนียม','ต้นทุน (บาท)','สถานะ','กำไรที่รับรู้ (บาท)']);
  L.forEach(l=>{const s=SL.find(x=>x.lot_id===l.id),k=lotKind(l);pf.push([KT[k],d2(lotDate(l))[0],symLabel(l.symbol,k),nm(l.holding_account_id),Number(l.units),Number(l.unit_price),l.currency,Number(l.fx_rate),Number(l.fee),Number(l.cost_thb),s?'ขายแล้ว':'ถืออยู่',s?Number(s.profit):''])});add(pf,'พอร์ตลงทุน');
  const sl=[['รายการขายสินทรัพย์ลงทุน'],[],['วันที่ขาย','หมวด','รายการ','จำนวน','ราคา/อัตราขาย','รับเงิน (บาท)','ต้นทุน (บาท)','กำไร/ขาดทุน (บาท)']];
  SL.forEach(s=>{const l=L.find(x=>x.id===s.lot_id),t=T.find(x=>x.id===s.sell_txn_id),k=l?lotKind(l):'security';sl.push([t?d2(t.occurred_at)[0]:'',KT[k],l?symLabel(l.symbol,k):'',Number(s.units),Number(s.sell_price),Number(s.proceeds),Number(s.cost_thb),Number(s.profit)])});add(sl,'ขายสินทรัพย์');
  const ip=[['ผ่อนชำระบัตรเครดิต'],[],['บัตร','รายการ','งวดที่','ครบกำหนด','ยอดต่องวด (บาท)','สถานะ']];
  IP.forEach(p=>II.filter(i=>i.plan_id===p.id).sort((a,b)=>a.seq-b.seq).forEach(i=>ip.push([nm(p.card_account_id),p.title,i.seq+'/'+p.months,i.due_date,Number(i.amount),paidItem(i)?'จ่ายแล้ว':'ยังไม่จ่าย'])));add(ip,'ผ่อนชำระ');
  XLSX.writeFile(wb,'AnnyLuk_'+ym+'.xlsx');
}
function openManage(){
  openSheet(`<h2 style="margin-top:0">จัดการบัญชี</h2><div class="card">`+A.map((a,i)=>`<div class="row"><div><div>${esc(a.nickname)}</div><div class="mut">${esc(a.institution||'-')} · ${AT[a.account_type]}</div></div>
  <div style="display:flex;gap:6px"><button class="ghost" aria-label="เลื่อนขึ้น" onclick="mv(${i},-1)">▲</button><button class="ghost" aria-label="เลื่อนลง" onclick="mv(${i},1)">▼</button><button onclick="openEdit('${a.id}')">แก้ไข</button></div></div>`).join('')+`</div>
  <div class="btns" style="margin-top:14px"><button class="ghost" onclick="closeSheet()">ปิด</button><button class="pri" onclick="openEdit()">+ เพิ่มบัญชี</button></div>`);
}
async function mv(i,d){const j=i+d;if(j<0||j>=A.length)return;const a=A[i],b=A[j];
  await q(sb.from('accounts').update({display_order:b.display_order}).eq('id',a.id));
  await q(sb.from('accounts').update({display_order:a.display_order}).eq('id',b.id));
  A=await q(sb.from('accounts').select('*').is('deleted_at',null).order('display_order'));openManage();home()}
function openEdit(id){
  const a=id?A.find(x=>x.id===id):{nickname:'',institution:'',account_type:'deposit',opening_balance:0,credit_limit:''};
  openSheet(`<h2 style="margin-top:0">${id?'แก้ไขบัญชี':'เพิ่มบัญชี'}</h2><label>ชื่อเรียก<input id="en" value="${esc(a.nickname)}"></label>
  <label>ธนาคาร/สถาบัน<input id="ei" value="${esc(a.institution)}"></label>
  <label>ประเภท<select id="et">${Object.keys(AT).map(k=>`<option value="${k}"${k===a.account_type?' selected':''}>${AT[k]}</option>`).join('')}</select></label>
  <label>ยอดยกมา (บัตรที่มีหนี้อยู่ ใส่เป็นเลขติดลบ)<input id="eo" type="number" step="0.01" value="${a.opening_balance}"></label>
  <label>วงเงิน (เฉพาะบัตรเครดิต)<input id="el" type="number" step="0.01" value="${a.credit_limit==null?'':a.credit_limit}"></label><div class="err" id="ee"></div>
  <div class="btns"><button class="ghost" onclick="openManage()">ยกเลิก</button><button class="pri" onclick="saveAcct('${id||''}')">บันทึก</button></div>
  ${id?`<button class="del" style="width:100%;margin-top:10px" onclick="delAcct('${id}')">ลบบัญชีนี้</button>`:''}`);
}
async function saveAcct(id){
  const n=$('en').value.trim();if(!n){$('ee').textContent='ใส่ชื่อบัญชี';return}
  const t=$('et').value,row={nickname:n,institution:$('ei').value.trim()||null,account_type:t,opening_balance:Number($('eo').value)||0,credit_limit:t==='card'&&$('el').value!==''?Number($('el').value):null};
  if(id)await q(sb.from('accounts').update(row).eq('id',id));
  else{row.display_order=A.reduce((m,x)=>Math.max(m,x.display_order),0)+1;await q(sb.from('accounts').insert(row))}
  await load();openManage();
}
async function delAcct(id){if(!confirm('ลบบัญชีนี้? รายการเก่าที่เกี่ยวข้องจะยังอยู่ในประวัติ'))return;
  await q(sb.from('accounts').update({deleted_at:new Date().toISOString()}).eq('id',id));await load();openManage()}
const excl=id=>{const a=A.find(x=>x.id===id);return !!(a&&a.exclude_from_total)};
const sw=a=>`<span class="sw" title="นับรวมในยอดรวม"><input type="checkbox" aria-label="นับรวมในยอดรวม ${esc(a.nickname)}" ${a.exclude_from_total?'':'checked'} onchange="toggleInc('${a.id}',this.checked)"><i></i></span>`;
async function toggleInc(id,on){await q(sb.from('accounts').update({exclude_from_total:!on}).eq('id',id));const a=A.find(x=>x.id===id);if(a)a.exclude_from_total=!on;home()}
init();
</script>
